[project]
name = "myfoundrymultiagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepa Rajasabeson", email = "deeparajasabeson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "azure-ai-projects>=2.5.0",
    "azure-core>=1.41.0",
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
myfoundrymultiagents = "myfoundrymultiagents:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
